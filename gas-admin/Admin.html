<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DYNOV Admin</title><style>:root{color-scheme:dark;--bg:#090a0c;--surface:#16181c;--line:#30333a;--text:#f4f5f6;--muted:#9ba1ab;--accent:#d8f36c}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font:14px/1.55 system-ui;margin:0;padding:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.side{border-right:1px solid var(--line);padding:32px 22px}.brand{font-size:27px;font-weight:850;letter-spacing:-1px}.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted)}.nav{background:#23262c;border:1px solid #373b43;border-radius:10px;padding:13px;margin-top:44px}.content{padding:36px clamp(20px,4vw,55px);min-width:0;max-width:1600px;width:100%}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:2px}h1{font-size:40px;letter-spacing:-2px;margin:25px 0 2px}.sub{color:var(--muted);margin:0 0 30px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:35px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:22px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:32px;margin-top:12px}.stat:first-child strong{color:var(--accent)}.sectiontitle{font-size:19px;font-weight:750;margin-bottom:16px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}.toolbar input{flex:1;min-width:210px}.control,button{background:#202329;color:#fff;border:1px solid #393d45;border-radius:10px;padding:11px 13px}button:hover{background:#30343c}.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:15px;overflow-x:auto}table{width:100%;min-width:720px;border-collapse:collapse;margin:0}td,th{padding:16px 18px;text-align:left;border-bottom:1px solid #2b2e34}th{color:var(--muted);font-size:12px}tbody tr{cursor:pointer}tbody tr:hover{background:#24272d}tbody tr:last-child td{border-bottom:0}.muted{color:var(--muted);font-size:12px}.pill{border:1px solid #555c48;color:var(--accent);padding:5px 10px;border-radius:100px;font-size:12px}.overlay{position:fixed;inset:0;background:#000b;display:none;z-index:20}.overlay.open{display:block}.drawer{position:absolute;right:0;top:0;bottom:0;overflow:auto;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);padding:28px}.drawerheader{display:flex;justify-content:space-between;align-items:center}.detail{padding:13px 0;border-bottom:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.detail label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.drawer select,.drawer textarea{display:block;width:100%;margin:8px 0 18px}.drawer textarea{min-height:110px;resize:vertical}.primary{background:var(--accent);color:#111;font-weight:750}.primary:hover{background:#c8e459}#error,#saveError{color:#ff9d9d}#notice{color:var(--accent)}@media(max-width:850px){.shell{display:block}.side{padding:16px 24px;border-right:0;border-bottom:1px solid var(--line)}.nav{display:none}.content{padding:25px 18px}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:32px}}</style></head><body><div class="shell"><aside class="side"><div class="brand">DYNOV<small>ADMIN CONSOLE</small></div><div class="nav">▦ &nbsp; 문의 관리</div></aside><main class="content"><div class="eyebrow">WORKSPACE / INQUIRIES</div><h1>Overview<span style="color:var(--accent)">.</span></h1><p class="sub">프로젝트 문의와 진행 상황을 한곳에서 관리하세요.</p><div class="stats"><div class="stat"><span>전체 문의</span><strong id="total">—</strong></div><div class="stat"><span>신규 문의</span><strong id="newCount">—</strong></div><div class="stat"><span>검토 중</span><strong id="reviewCount">—</strong></div><div class="stat"><span>완료</span><strong id="doneCount">—</strong></div></div><div class="sectiontitle">Project Inquiries <span id="count" class="muted"></span></div><div class="toolbar"><input id="search" class="control" type="search" placeholder="이름, 프로젝트, 문의 내용 검색"><select id="filter" class="control" aria-label="상태 필터"><option value="">전체 상태</option><option>신규</option><option>검토중</option><option>견적발송</option><option>보류</option><option>완료</option></select><select id="sort" class="control" aria-label="정렬"><option value="desc">최신순</option><option value="asc">오래된순</option></select><button id="refresh">↻ 새로고침</button><button id="csv">↓ CSV</button></div><p id="error" role="alert"></p><p id="notice" role="status"></p><div id="table" class="tablewrap">불러오는 중...</div></main></div><div id="overlay" class="overlay"><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="drawerheader"><span class="eyebrow">INQUIRY DETAILS</span><button id="close">✕ 닫기</button></div><h2 id="detailTitle">문의 상세</h2><div id="details"></div><label for="detailStatus">진행 상태</label><select id="detailStatus" class="control"><option>신규</option><option>검토중</option><option>견적발송</option><option>보류</option><option>완료</option></select><label for="detailNote">관리자 메모</label><textarea id="detailNote" class="control" maxlength="2000"></textarea><p id="saveError" role="alert"></p><button id="save" class="primary">변경사항 저장</button></div></div><script>'use strict';let rows=[],selected=null,lastFocus=null;const $=s=>document.querySelector(s);function el(tag,t){const x=document.createElement(tag);if(t!==undefined)x.textContent=String(t??'');return x}function load(){$('#error').textContent='';$('#refresh').disabled=true;google.script.run.withSuccessHandler(data=>{rows=Array.isArray(data)?data:[];$('#refresh').disabled=false;render()}).withFailureHandler(e=>{$('#refresh').disabled=false;$('#error').textContent=e.message||String(e)}).listInquiries()}function visible(){const q=$('#search').value.trim().toLowerCase(),st=$('#filter').value;return rows.filter(r=>(!st||(r.status||'신규')===st)&&(!q||[r.id,r.name,r.company,r.scope,r.projectType,r.email,r.phone].some(v=>String(v??'').toLowerCase().includes(q)))).sort((a,b)=>{const x=String(a.timestamp||'').localeCompare(String(b.timestamp||''));return $('#sort').value==='asc'?x:-x})}function render(){$('#total').textContent=rows.length;$('#newCount').textContent=rows.filter(r=>!r.status||r.status==='신규').length;$('#reviewCount').textContent=rows.filter(r=>r.status==='검토중').length;$('#doneCount').textContent=rows.filter(r=>r.status==='완료').length;const v=visible();$('#count').textContent='('+v.length+'건)';const root=$('#table');root.replaceChildren();if(!v.length){root.append(el('p','표시할 문의가 없습니다.'));return}const table=el('table'),head=el('tr');['접수일 / 의뢰번호','프로젝트','고객 / 회사','상태',''].forEach(t=>head.append(el('th',t)));table.append(head);v.forEach(r=>{const tr=el('tr');tr.tabIndex=0;const date=el('td');date.append(el('div',r.timestamp),el('div',r.id));const project=el('td');project.append(el('strong',r.projectType||'미지정'),el('div',String(r.scope||'').slice(0,85)));const customer=el('td');customer.append(el('strong',r.name),el('div',r.company||r.email));const status=el('td');const pill=el('span',r.status||'신규');pill.className='pill';status.append(pill);tr.append(date,project,customer,status,el('td','상세 보기 ↗'));tr.addEventListener('click',()=>openDetail(r));tr.addEventListener('keydown',e=>{if(e.key==='Enter'){openDetail(r)}});table.append(tr)});root.append(table)}function openDetail(r){selected=r;lastFocus=document.activeElement;$('#detailTitle').textContent=r.name||'문의 상세';const box=$('#details');box.replaceChildren();[['의뢰번호',r.id],['접수일',r.timestamp],['프로젝트 유형',r.projectType],['예상 분량',r.pages],['작업 범위',r.scope],['예산',r.budget],['회사',r.company],['이메일',r.email],['연락처',r.phone],['자료 링크',r.link]].forEach(([k,v])=>{const d=el('div');d.className='detail';d.append(el('label',k),el('div',v||'—'));box.append(d)});$('#detailStatus').value=r.status||'신규';$('#detailNote').value=r.note||'';$('#saveError').textContent='';$('#overlay').classList.add('open');$('#close').focus()}function closeDetail(){if($('#save').disabled)return;$('#overlay').classList.remove('open');selected=null;if(lastFocus?.isConnected)lastFocus.focus()}$('#close').addEventListener('click',closeDetail);$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});$('#save').addEventListener('click',()=>{if(!selected)return;const r=selected,status=$('#detailStatus').value,note=$('#detailNote').value;$('#save').disabled=true;google.script.run.withSuccessHandler(()=>{r.status=status;r.note=note;$('#save').disabled=false;closeDetail();$('#notice').textContent='변경사항이 저장되었습니다.';render()}).withFailureHandler(e=>{$('#save').disabled=false;$('#saveError').textContent=e.message||String(e)}).updateInquiry(r.id,status,note)});['search','filter','sort'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));$('#refresh').addEventListener('click',load);$('#csv').addEventListener('click',()=>{const keys=['id','timestamp','projectType','pages','scope','budget','name','company','email','phone','status','note'];const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[keys.join(','),...visible().map(r=>keys.map(k=>esc(r[k])).join(','))].join('\r\n');const a=el('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='dynov-inquiries.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});load();</script></body></html>
