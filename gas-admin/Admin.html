<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DYNOV Admin</title><style>:root{color-scheme:dark;--bg:#0b0c0e;--surface:#121416;--surface2:#191b1e;--line:#292c30;--text:#eeefed;--muted:#8d9399;--soft:#b8bdc1;--accent:#e5e7e4}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Pretendard",sans-serif;margin:0;padding:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #d1d6d5;outline-offset:2px}.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}.side{border-right:1px solid var(--line);padding:32px 20px;display:flex;flex-direction:column}.brand{font-size:25px;font-weight:850;letter-spacing:-1.1px;padding:0 13px}.brand small{display:block;font-size:9px;letter-spacing:2.5px;color:var(--muted);font-weight:600;margin-top:-4px}.navlabel{font-size:10px;letter-spacing:1.5px;color:#686e74;margin:47px 13px 12px}.nav{background:#24272a;border:1px solid #303338;border-radius:8px;padding:10px 12px;color:#f4f4f2;font-weight:650}.sidefoot{margin-top:auto;padding:16px 13px 0;border-top:1px solid var(--line);font-size:10px;color:#777e83;letter-spacing:.8px}.content{padding:40px clamp(28px,3.2vw,72px) 80px;min-width:0;max-width:none;width:100%}.eyebrow{color:#81888d;font-size:12px;letter-spacing:1.8px;text-transform:uppercase}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.topright{display:flex;gap:9px;align-items:center;color:#9da3a8;font-size:11px}.dot{width:6px;height:6px;background:#b6c2bb;border-radius:50%;display:inline-block}h1{font-size:42px;letter-spacing:-1.7px;font-weight:680;margin:24px 0 3px}.sub{color:var(--muted);margin:0 0 28px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;margin-bottom:34px;overflow:hidden;background:#121416}.stat{padding:24px 28px;border-right:1px solid var(--line);min-height:128px}.stat:last-child{border-right:0}.stat span{color:#999fa4;font-size:13px}.stat strong{display:block;font-size:34px;letter-spacing:-1px;font-weight:580;margin-top:7px;color:#f0f0ed}.stat:first-child strong{color:#fff}.sectionline{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sectiontitle{font-size:20px;font-weight:670;letter-spacing:-.3px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px}.toolbar input{flex:1;min-width:220px}.control,button{background:#191b1e;color:#e5e6e4;border:1px solid #35383d;border-radius:7px;padding:12px 16px;min-height:46px}button:hover{background:#2a2d31}.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow-x:auto;min-height:100px}table{width:100%;min-width:780px;border-collapse:collapse;margin:0}td,th{padding:20px 22px;text-align:left;border-bottom:1px solid #282b2f}th{background:#17191b;color:#91979d;font-size:12px;letter-spacing:.5px;font-weight:600}td{font-size:14px;color:#dce0df}td strong{font-weight:650;color:#f0f1ee}td div+div{color:#93999f;font-size:13px;margin-top:4px}tbody tr{cursor:pointer;transition:background .15s}tbody tr:hover{background:#202326}tbody tr:last-child td{border-bottom:0}.muted{color:var(--muted);font-size:13px}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #45494d;background:#202327;color:#e0e3df;padding:4px 10px;border-radius:5px;font-size:11px}.pill:before{content:"";height:5px;width:5px;border-radius:50%;background:#aeb8b2}.overlay{position:fixed;inset:0;background:#000b;display:none;z-index:20}.overlay.open{display:block}.drawer{position:absolute;right:0;top:0;bottom:0;overflow:auto;width:min(620px,100%);background:#151719;border-left:1px solid #35383d;padding:42px}.drawerheader{display:flex;justify-content:space-between;align-items:center}.drawer h2{font-size:27px;letter-spacing:-.8px;margin:25px 0}.detail{padding:13px 0;border-bottom:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.detail label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.drawer select,.drawer textarea{display:block;width:100%;margin:8px 0 18px}.drawer textarea{min-height:130px;resize:vertical}.primary{background:#e4e6e2;color:#151718;font-weight:750}.primary:hover{background:#fff}#error,#saveError{color:#ff9d9d}#notice{color:#a9c3b5}.empty{padding:45px 20px;text-align:center;color:var(--muted)}@media(max-width:850px){.shell{display:block}.side{padding:16px 22px;border-right:0;border-bottom:1px solid var(--line)}.nav,.navlabel,.sidefoot{display:none}.content{padding:25px 18px}.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}h1{font-size:30px}}@media(min-width:1600px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.content{padding-left:64px;padding-right:64px}.toolbar{gap:12px}.tablewrap{width:100%}}@media(min-width:2200px){.content{padding-left:84px;padding-right:84px}.side{padding-left:28px;padding-right:28px}}@media(max-width:850px){.content{padding:25px 18px}.stat{min-height:100px;padding:16px}td,th{padding:14px 12px}}@media(max-width:520px){.toolbar input{min-width:100%}.toolbar>*{flex:1}.stat strong{font-size:26px}} </style></head><body><div class="shell"><aside class="side"><div class="brand">DYNOV<small>ADMIN CONSOLE</small></div><div class="navlabel">WORKSPACE</div><div class="nav">▦ &nbsp; 문의 관리</div><div class="sidefoot">DYNOV DESIGN STUDIO<br>PRIVATE WORKSPACE</div></aside><main class="content"><div class="top"><div class="eyebrow">WORKSPACE / INQUIRIES</div><div class="topright"><span class="dot"></span> GOOGLE SHEETS</div></div><h1>문의 관리</h1><p class="sub">접수된 프로젝트 문의와 진행 현황을 확인합니다.</p><div class="stats"><div class="stat"><span>전체 문의</span><strong id="total">—</strong></div><div class="stat"><span>신규 문의</span><strong id="newCount">—</strong></div><div class="stat"><span>검토 중</span><strong id="reviewCount">—</strong></div><div class="stat"><span>완료</span><strong id="doneCount">—</strong></div></div><div class="sectionline"><div class="sectiontitle">Project Inquiries <span id="count" class="muted"></span></div><div class="muted">INQUIRY LIST</div></div><div class="toolbar"><input id="search" class="control" type="search" placeholder="이름, 프로젝트, 문의 내용 검색" aria-label="문의 검색"><select id="filter" class="control" aria-label="상태 필터"><option value="">전체 상태</option><option>신규</option><option>검토중</option><option>견적발송</option><option>보류</option><option>완료</option></select><select id="sort" class="control" aria-label="정렬"><option value="desc">최신순</option><option value="asc">오래된순</option></select><button id="refresh">↻ 새로고침</button><button id="csv">↓ CSV</button></div><p id="error" role="alert"></p><p id="notice" role="status"></p><div id="table" class="tablewrap"><div class="empty">문의 목록을 불러오는 중...</div></div></main></div><div id="overlay" class="overlay"><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="drawerheader"><span class="eyebrow">INQUIRY DETAILS</span><button id="close" aria-label="닫기">✕ 닫기</button></div><h2 id="detailTitle">문의 상세</h2><div id="details"></div><label for="detailStatus">진행 상태</label><select id="detailStatus" class="control"><option>신규</option><option>검토중</option><option>견적발송</option><option>보류</option><option>완료</option></select><label for="detailNote">관리자 메모</label><textarea id="detailNote" class="control" maxlength="2000"></textarea><p id="saveError" role="alert"></p><button id="save" class="primary">변경사항 저장</button></div></div><script>'use strict';let rows=[],selected=null,lastFocus=null;const $=s=>document.querySelector(s);function el(tag,t){const x=document.createElement(tag);if(t!==undefined)x.textContent=String(t??'');return x}function load(){$('#error').textContent='';$('#refresh').disabled=true;google.script.run.withSuccessHandler(data=>{rows=Array.isArray(data)?data:[];$('#refresh').disabled=false;render()}).withFailureHandler(e=>{$('#refresh').disabled=false;$('#error').textContent=e.message||String(e)}).listInquiries()}function visible(){const q=$('#search').value.trim().toLowerCase(),st=$('#filter').value;return rows.filter(r=>(!st||(r.status||'신규')===st)&&(!q||[r.id,r.name,r.company,r.scope,r.projectType,r.email,r.phone].some(v=>String(v??'').toLowerCase().includes(q)))).sort((a,b)=>{const x=String(a.timestamp||'').localeCompare(String(b.timestamp||''));return $('#sort').value==='asc'?x:-x})}function render(){$('#total').textContent=rows.length;$('#newCount').textContent=rows.filter(r=>!r.status||r.status==='신규').length;$('#reviewCount').textContent=rows.filter(r=>r.status==='검토중').length;$('#doneCount').textContent=rows.filter(r=>r.status==='완료').length;const v=visible();$('#count').textContent='('+v.length+'건)';const root=$('#table');root.replaceChildren();if(!v.length){root.append(el('p','표시할 문의가 없습니다.'));return}const table=el('table'),head=el('tr');['접수일 / 의뢰번호','프로젝트','고객 / 회사','상태',''].forEach(t=>head.append(el('th',t)));table.append(head);v.forEach(r=>{const tr=el('tr');tr.tabIndex=0;const date=el('td');date.append(el('div',r.timestamp),el('div',r.id));const project=el('td');project.append(el('strong',r.projectType||'미지정'),el('div',String(r.scope||'').slice(0,85)));const customer=el('td');customer.append(el('strong',r.name),el('div',r.company||r.email));const status=el('td');const pill=el('span',r.status||'신규');pill.className='pill';status.append(pill);tr.append(date,project,customer,status,el('td','상세 보기 ↗'));tr.addEventListener('click',()=>openDetail(r));tr.addEventListener('keydown',e=>{if(e.key==='Enter'){openDetail(r)}});table.append(tr)});root.append(table)}function openDetail(r){selected=r;lastFocus=document.activeElement;$('#detailTitle').textContent=r.name||'문의 상세';const box=$('#details');box.replaceChildren();[['의뢰번호',r.id],['접수일',r.timestamp],['프로젝트 유형',r.projectType],['예상 분량',r.pages],['작업 범위',r.scope],['예산',r.budget],['회사',r.company],['이메일',r.email],['연락처',r.phone],['자료 링크',r.link]].forEach(([k,v])=>{const d=el('div');d.className='detail';d.append(el('label',k),el('div',v||'—'));box.append(d)});$('#detailStatus').value=r.status||'신규';$('#detailNote').value=r.note||'';$('#saveError').textContent='';$('#overlay').classList.add('open');$('#close').focus()}function closeDetail(){if($('#save').disabled)return;$('#overlay').classList.remove('open');selected=null;if(lastFocus?.isConnected)lastFocus.focus()}$('#close').addEventListener('click',closeDetail);$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});$('#save').addEventListener('click',()=>{if(!selected)return;const r=selected,status=$('#detailStatus').value,note=$('#detailNote').value;$('#save').disabled=true;google.script.run.withSuccessHandler(()=>{r.status=status;r.note=note;$('#save').disabled=false;closeDetail();$('#notice').textContent='변경사항이 저장되었습니다.';render()}).withFailureHandler(e=>{$('#save').disabled=false;$('#saveError').textContent=e.message||String(e)}).updateInquiry(r.id,status,note)});['search','filter','sort'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));$('#refresh').addEventListener('click',load);$('#csv').addEventListener('click',()=>{const keys=['id','timestamp','projectType','pages','scope','budget','name','company','email','phone','status','note'];const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[keys.join(','),...visible().map(r=>keys.map(k=>esc(r[k])).join(','))].join('\r\n');const a=el('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='dynov-inquiries.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});load();</script></body></html>
